name=UngulaCanbus
version=0.1.1
author=Alex Conesa <alexconesap@gmail.com>
maintainer=Alex Conesa <alexconesap@gmail.com>
sentence=Embedded C++17 CAN-bus service layer + per-brand wire protocols, built on UngulaHal's classic-CAN abstraction.
paragraph=Sits between UngulaHal (which owns the CAN controller hardware: ESP32 TWAI today, future MCP2515 and CAN-FD parallel hierarchies) and host application code. Provides generic bus helpers (node discovery via templated scanNodes, RX drain, send-and-await-reply) and per-brand device protocols under devices/<brand>/. Today ships the MyActuator RMD V3 protocol (motor commands, set-node-id broadcast, runtime probe). New CAN devices, motor or otherwise, drop into devices/<brand>/ with their own constants and operations; no library split needed per brand.
category=Communication
url=https://github.com/alexconesap/ungula-canbus.git
includes=ungula_canbus.h
depends=UngulaHal
architectures=esp32

# C++ compatibility (developer-facing metadata)
